name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Lint · Type-check · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test (unitarios + integración)
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

  migrate:
    name: Migrate (Supabase)
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # El deploy de la app lo maneja Vercel via su Git integration (GitHub App),
    # por eso este job solo aplica las migraciones de la base.
    # Para que corra de verdad hay que cargar el secret en
    # Settings -> Secrets and variables -> Actions:
    #   SUPABASE_DB_URL -> connection string de Postgres (para `db push`)
    # Si falta, los pasos se saltean y el job pasa igual (no rompe CI).
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        if: ${{ env.SUPABASE_DB_URL != '' }}
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Aplicar migraciones (supabase db push)
        if: ${{ env.SUPABASE_DB_URL != '' }}
        run: supabase db push --db-url "$SUPABASE_DB_URL"
